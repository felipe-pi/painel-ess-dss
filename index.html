<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Painel ESS</title>

    <link rel="stylesheet" href="./assents/css/style.css?v=20260716-subarea1" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>

  <body>
    <div class="mobile-header">
      <button id="menuToggle" class="menu-btn">&#9776;</button>

      <div class="logo">
        <img src="assets/img/logo.png" alt="ESS" />
      </div>
    </div>

    <aside class="sidebar" id="sidebar">
      <nav>
        <a href="index.html" class="menu-item active">
          <i class="fa-solid fa-chart-column"></i>
          Dashboard
        </a>

        <a href="dss.html" class="menu-item">
          <i class="fa-solid fa-comments"></i>
          DSS
        </a>

        <a href="altas_horas.html" class="menu-item">
          <i class="fa-solid fa-clock"></i>
          Altas Horas
        </a>

        <a href="#" class="menu-item">
          <i class="fa-solid fa-ranking-star"></i>
          Ranking
        </a>
      </nav>
    </aside>

    <main class="main-content">
      <div class="container">
        <h1>&#128202; Painel ESS</h1>

        <p class="atualizado">
          Atualizado em:
          <span id="atualizado"></span>
        </p>

        <div class="filtros">
          <input
            type="text"
            id="busca"
            placeholder="Digite matricula ou nome"
          />

          <select id="areaFiltro">
            <option value="">Todas as areas</option>
            <option value="STC">STC</option>
            <option value="MANUTENCAO">Manutencao</option>
            <option value="RECUPERACAO">Recuperacao</option>
          </select>

          <select id="subareaFiltro" class="filtro-subarea hidden">
            <option value="">Todas as subdivisoes</option>
          </select>

          <select id="classificacaoFiltro">
            <option value="">Todos</option>
            <option value="Ciclo+10">Ciclo+10</option>
            <option value="Inspeção">Inspecao</option>
          </select>

          <div class="filtros-data">
            <input type="date" id="dataInicio" />
            <input type="date" id="dataFim" />
            <button id="btnAplicar">Atualizar</button>
            <button id="btnLimpar" type="button">Limpar</button>
          </div>
        </div>

        <div class="cards">
          <div class="card">
            <h3>Colaboradores</h3>
            <p id="colaboradores">0</p>
          </div>

          <div class="card">
            <h3>Meta Geral</h3>
            <p id="metaGeral">0</p>
          </div>

          <div class="card">
            <h3>Realizado</h3>
            <p id="realizadoGeral">0</p>
          </div>

          <div class="card">
            <h3>Performance</h3>
            <p id="performanceGeral">0%</p>
          </div>
        </div>

        <table>
          <thead>
            <tr>
              <th>Matricula</th>
              <th>Inspetor</th>
              <th>Area</th>
              <th>Classificacao</th>
              <th>Meta</th>
              <th>Realizado</th>
              <th>Performance</th>
              <th>Status</th>
            </tr>
          </thead>

          <tbody id="tabelaInspetores"></tbody>
        </table>
      </div>
    </main>

    <script src="./assents/js/app.js?v=20260716-subarea1"></script>
  </body>
</html>
